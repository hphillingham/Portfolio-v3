name: Deploy

# development deploys to the portfolio-development Worker on dev.harrison.phillingham.com.
# production deploys to the portfolio Worker on harrison.phillingham.com.
on:
  push:
    branches: [development, production]
  # Manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ gitea.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: gitea.ref_name == 'development' || gitea.ref_name == 'production'
    runs-on: ubuntu-24.04
    env:
      GITHUB_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
    steps:
      # The runner image has no git-lfs, which the checkout below needs
      - name: Install Git LFS
        run: |
          apt-get update -qq -o Acquire::Retries=3
          apt-get install -y --no-install-recommends -o Acquire::Retries=3 git-lfs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Commitizen needs the full history and tags to work out the next version
          fetch-depth: 0
          # static/ is stored in Git LFS, so without this the build ships pointer files
          lfs: true

      - uses: ./.gitea/actions/commitizen

      # The version the next release will get (or the current one, if no commit changes it).
      # Runs before release.yml bumps, so production gets the version that release is about to tag.
      - name: Work out the version
        id: version
        env:
          BRANCH: ${{ gitea.ref_name }}
          RUN_NUMBER: ${{ gitea.run_number }}
        run: |
          v=$(cz bump --yes --get-next 2>/dev/null || cz version --project)
          [ "$BRANCH" = production ] || v="$v-rc.$RUN_NUMBER"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Deploying $BRANCH as $v"

      - uses: ./.gitea/actions/setup

      - run: pnpm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # "" is the top-level wrangler config, which is production
          WRANGLER_ENV: ${{ gitea.ref_name == 'development' && 'development' || '' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: pnpm exec wrangler deploy --env "$WRANGLER_ENV" --message "$VERSION"
